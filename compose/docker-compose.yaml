# Qwen3.8-27B-Digisensus on ONE RTX 5090: 262,144-token context, nvfp4 KV cache, MTP k=3.
# Build the image first (../image/build.sh), download the model, copy .env.example -> .env.
#
# KV budget is pinned (--kv-cache-memory-bytes) so the pool is identical on every boot:
# 266,197 tokens at 0.94 utilisation. expandable_segments avoids the allocator
# fragmentation that OOM-killed engines under mixed-length traffic at the same setting.
#
# Comments must never go inside the `command: >-` block: it is a YAML folded scalar,
# '#' lines would become literal argv and vLLM refuses to boot.
services:
  vllm:
    image: ${IMAGE}
    container_name: digisensus-qwen38
    ports:
      - "${PORT}:9000"
    volumes:
      - ${MODEL_DIR}:/models/model:ro
      - ./cache:/root/.cache
      - ./healthcheck.sh:/healthcheck.sh:ro
      # Runtime patches (see ../patches/README.md). Each is a whole file for vLLM v0.28.0.
      - ../patches/files/backend_guidance.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/structured_output/backend_guidance.py:ro
      - ../patches/files/structured_output__init__.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/structured_output/__init__.py:ro
      - ../patches/files/scheduler.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/core/sched/scheduler.py:ro
      - ../patches/files/detokenizer.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/engine/detokenizer.py:ro
      - ../patches/files/parser_engine.py:/usr/local/lib/python3.12/dist-packages/vllm/parser/engine/parser_engine.py:ro
      - ../patches/files/qwen3_5.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/qwen3_5.py:ro
      - ../patches/files/qwen3_5_mtp.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/qwen3_5_mtp.py:ro
    environment:
      - VLLM_ATTENTION_BACKEND=FLASHINFER
      - VLLM_FLASHINFER_WORKSPACE_BUFFER_SIZE=134217728
      - CUDA_MODULE_LOADING=LAZY
      - PYTHONHASHSEED=0
      - VLLM_NO_USAGE_STATS=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_UUID}"]
              capabilities: [gpu]
    command: >-
      --model /models/model
      --served-model-name qwen3.8-27b-digisensus qwen
      --trust-remote-code
      --language-model-only
      --kv-cache-dtype nvfp4
      --mamba-ssm-cache-dtype bfloat16
      --mamba-cache-mode align
      --enable-prefix-caching
      --max-model-len 262144
      --max-num-seqs 8
      --max-num-batched-tokens 8192
      --gpu-memory-utilization 0.94
      --kv-cache-memory-bytes 5694957226
      --compilation-config '{"max_cudagraph_capture_size": 32}'
      --speculative-config '{"method": "qwen3_5_mtp", "num_speculative_tokens": 3}'
      --reasoning-parser qwen3
      --structured-outputs-config '{"backend": "guidance", "disable_additional_properties": true}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --host 0.0.0.0
      --port 9000
    healthcheck:
      test: ["CMD-SHELL", "sh /healthcheck.sh"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 900s
    restart: unless-stopped
